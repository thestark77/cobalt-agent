name: Verify patch against latest Hermes release

on:
  schedule:
    # Daily at 08:00 UTC — Hermes ships weekly, this catches breakage early.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: 'Hermes ref (tag/branch/SHA). Default: latest release.'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cobalt-agent
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve Hermes ref
        id: hermes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REF: ${{ github.event.inputs.hermes_ref }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
            SOURCE="workflow_dispatch input"
          else
            REF=$(gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name)
            SOURCE="latest release"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "Hermes ref: $REF ($SOURCE)"

      - name: Clone Hermes into ~/.hermes/hermes-agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.hermes.outputs.ref }}
        run: |
          mkdir -p "$HOME/.hermes"
          gh repo clone NousResearch/hermes-agent "$HOME/.hermes/hermes-agent" -- \
            --branch "$REF" --depth 1

      - name: Apply patch
        id: apply
        run: python3 patches/apply_routing_patch.py apply

      - name: Verify patch
        id: verify
        run: python3 patches/apply_routing_patch.py verify

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.hermes.outputs.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          TITLE="patch-verify: broken on Hermes $REF"
          # De-duplicate: don't open a new issue if one already exists for this ref
          EXISTING=$(gh issue list \
            --state open \
            --search "$TITLE in:title" \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Re-triggered failure on run $RUN_URL"
            exit 0
          fi
          BODY=$(cat <<EOF
          apply_routing_patch.py failed against Hermes \`$REF\`.

          The patch patterns in \`tools/delegate_tool.py\` may have drifted. Inspect the file at the failing ref and update \`patches/apply_routing_patch.py\` (\`ORIGINAL_LINES\` / \`PATCHED_REPLACEMENTS\`) to match.

          - Run: $RUN_URL
          - Ref: \`$REF\`
          - Auto-generated by \`.github/workflows/patch-verify.yml\`.
          EOF
          )
          gh issue create --title "$TITLE" --label "patch-drift" --body "$BODY"
